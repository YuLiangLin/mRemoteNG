name: Release mRemoteNG Fork

run-name: Release ${{ github.event.inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*-yll.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to release, for example v1.78.2-yll.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mremoteng-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  build-release:
    name: Build and publish single EXE
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      assembly_version: ${{ steps.release.outputs.assembly_version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<base>\d+\.\d+\.\d+)-yll\.(?<fork>\d+)$') {
            throw "Release tag '$tag' must match v<major>.<minor>.<patch>-yll.<release>, for example v1.78.2-yll.1."
          }

          $forkRelease = [int]$Matches.fork
          if ($forkRelease -gt 65534) {
            throw "The fork release component must be between 0 and 65534."
          }

          $assemblyVersion = "$($Matches.base).$forkRelease"
          $informationalVersion = "$($Matches.base)-yll.$forkRelease+$($env:GITHUB_SHA.Substring(0, 7))"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "informational_version=$informationalVersion" >> $env:GITHUB_OUTPUT

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found on the GitHub-hosted Windows runner."
          }

          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) {
            throw "MSBuild was not found on the GitHub-hosted Windows runner."
          }

          "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Generate and stamp AssemblyInfo
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-t4
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"

          $assemblyTemplate = Join-Path $env:GITHUB_WORKSPACE "mRemoteNG\Properties\AssemblyInfo.tt"
          t4 $assemblyTemplate -P platformType=x64

          $assemblyInfo = Join-Path $env:GITHUB_WORKSPACE "mRemoteNG\Properties\AssemblyInfo.cs"
          $content = Get-Content -LiteralPath $assemblyInfo -Raw
          $content = $content -replace 'AssemblyVersion\("[^"]+"\)', 'AssemblyVersion("${{ steps.release.outputs.assembly_version }}")'
          $content = $content -replace 'AssemblyFileVersion\("[^"]+"\)', 'AssemblyFileVersion("${{ steps.release.outputs.assembly_version }}")'
          $content = $content -replace 'AssemblyInformationalVersion\("[^"]+"\)', 'AssemblyInformationalVersion("${{ steps.release.outputs.informational_version }} x64")'
          Set-Content -LiteralPath $assemblyInfo -Value $content -Encoding utf8

      - name: Restore and publish
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE "mRemoteNG\mRemoteNG.csproj"
          & '${{ steps.msbuild.outputs.path }}' $project `
            /restore `
            /t:Build `
            /p:Configuration="Release Self-Contained" `
            /p:Platform=x64 `
            /p:TransformOnBuild=false `
            /p:SelfContained=true `
            /p:PublishSingleFile=true `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild publish failed with exit code $LASTEXITCODE."
          }

      - name: Prepare Release and GitHub Pages files
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "mRemoteNG\bin\x64\Publish Self-Contained"
          $publishedFiles = @(Get-ChildItem -LiteralPath $publishDir -File)
          if ($publishedFiles.Count -ne 1 -or $publishedFiles[0].Name -ne "mRemoteNG.exe") {
            $names = $publishedFiles.Name -join ", "
            throw "Expected exactly one published file named mRemoteNG.exe, but found: $names"
          }

          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release-output\release"
          $pagesDir = Join-Path $env:GITHUB_WORKSPACE "release-output\pages"
          New-Item -ItemType Directory -Path $releaseDir, $pagesDir -Force | Out-Null

          $releaseExe = Join-Path $releaseDir "mRemoteNG.exe"
          Copy-Item -LiteralPath $publishedFiles[0].FullName -Destination $releaseExe

          $hash = (Get-FileHash -LiteralPath $releaseExe -Algorithm SHA512).Hash
          Set-Content -LiteralPath (Join-Path $releaseDir "mRemoteNG.exe.sha512") `
            -Value "$hash  mRemoteNG.exe" -Encoding ascii

          & "$env:GITHUB_WORKSPACE\Tools\Publish-GitHubPagesUpdateManifest.ps1" `
            -RepositoryOwner '${{ github.repository_owner }}' `
            -RepositoryName '${{ github.event.repository.name }}' `
            -TagName '${{ steps.release.outputs.tag }}' `
            -Version '${{ steps.release.outputs.assembly_version }}' `
            -ReleaseAsset $releaseExe `
            -OutputDir $pagesDir

          Get-Content -LiteralPath (Join-Path $pagesDir "update-portable.txt")

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $releaseExe = "$env:GITHUB_WORKSPACE\release-output\release\mRemoteNG.exe"
          $checksum = "$env:GITHUB_WORKSPACE\release-output\release\mRemoteNG.exe.sha512"
          $title = "mRemoteNG $tag"

          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $releaseExe $checksum --clobber --repo '${{ github.repository }}'
            gh release edit $tag --title $title --repo '${{ github.repository }}'
          }
          else {
            gh release create $tag $releaseExe $checksum `
              --verify-tag `
              --generate-notes `
              --title $title `
              --repo '${{ github.repository }}'
          }

      - name: Upload GitHub Pages content
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-update
          path: release-output/pages
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    name: Deploy update feed to GitHub Pages
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download generated update site
        uses: actions/download-artifact@v8
        with:
          name: github-pages-update
          path: update-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: update-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
